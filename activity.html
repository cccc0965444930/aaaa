<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>互動指引</title>

  <link rel="stylesheet" href="./style.css?v=5">
</head>

<body>
  <main class="app">

    <header class="chat-header">
      <div class="header-avatar">🙏</div>

      <div class="header-text">
        <h1 id="pageTitle">載入中</h1>
        <p>線上互動指引</p>
      </div>

      <button
        id="restartButton"
        class="restart-button"
        type="button"
        aria-label="重新開始"
      >
        ↻
      </button>
    </header>

    <section id="loadingScreen" class="status-screen">
      <div class="spinner"></div>
      <p>正在載入活動內容……</p>
    </section>

    <section id="errorScreen" class="status-screen hidden">
      <div class="error-icon">!</div>
      <h2>無法開啟活動</h2>
      <p id="errorMessage"></p>
    </section>

    <section id="chatScreen" class="chat-screen hidden">
      <div id="messages" class="messages"></div>
    </section>

  </main>

  <script src="./activity.js?v=5"></script>
</body>
</html>
