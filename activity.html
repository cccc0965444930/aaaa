<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="互動式活動指引"
  >

  <title>互動指引</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header class="chat-header">
      <div class="avatar">🙏</div>

      <div class="header-content">
        <h1 id="pageTitle">載入中</h1>
        <p>線上互動指引</p>
      </div>

      <button
        id="restartButton"
        class="restart-button"
        type="button"
        aria-label="重新開始"
      >
        ↻
      </button>
    </header>

    <section
      id="loadingScreen"
      class="status-screen"
    >
      <div class="loading-spinner"></div>
      <p>正在載入活動內容……</p>
    </section>

    <section
      id="errorScreen"
      class="status-screen hidden"
    >
      <div class="error-icon">!</div>
      <h2>無法開啟活動</h2>
      <p id="errorMessage"></p>
    </section>

    <section
      id="chatScreen"
      class="chat-screen hidden"
    >
      <div
        id="messages"
        class="messages"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <script src="activity.js"></script>
</body>
</html>
